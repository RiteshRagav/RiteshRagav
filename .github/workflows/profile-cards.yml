name: Refresh animated profile cards

on:
  schedule:
    - cron: "17 0 * * *" # daily at 00:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "generate_cards.py"
      - "data/**"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          python -m pip install "fonttools[woff]" || true

      - name: Fetch contribution history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: RiteshRagav
        run: python scripts/fetch_contributions.py

      - name: Render SVG cards
        run: python generate_cards.py

      - name: Commit updated data and cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated profile cards"
            git push
          else
            echo "No profile card changes to commit."
          fi
